<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>88 days 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff7eb3;--pink-2:#ff5c9d;--hot:#ff2e93;--purple:#b388ff;--gold:#ffd56b;
    --ink:#5a2a47;--radius:24px;--shadow:0 18px 50px rgba(255,46,147,.3);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:'Quicksand',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);
    min-height:100dvh;overflow-x:hidden;padding:22px 16px 60px;
    background:linear-gradient(-45deg,#ffd0e8,#ffe0f0,#f3d9ff,#ffe9c7,#ffd6ec);
    background-size:400% 400%;animation:flow 18s ease infinite;
  }
  @keyframes flow{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}

  .deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .deco span{position:absolute;bottom:-50px;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-118vh) rotate(420deg);opacity:0}}

  .wrap{position:relative;z-index:1;max-width:680px;margin:0 auto}
  header{text-align:center;margin-bottom:18px}
  h1{font-family:'Pacifico',cursive;font-size:clamp(34px,9vw,52px);margin:6px 0 2px;
    background:linear-gradient(90deg,var(--hot),var(--purple),var(--pink-2));background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
  @keyframes shine{to{background-position:200% center}}
  .tagline{font-size:14px;font-weight:700;color:#9a6e88;margin:0 0 14px}
  .hi{font-size:13px;font-weight:700;color:#c06fa0;margin:2px 0 12px}
  .hi a{color:var(--hot);cursor:pointer;text-decoration:underline}

  .progress{max-width:360px;margin:0 auto 6px;height:12px;border-radius:99px;background:rgba(255,255,255,.7);
    box-shadow:inset 0 2px 5px rgba(255,46,147,.15);overflow:hidden}
  .progress>i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--gold),var(--hot),var(--purple));transition:width .8s cubic-bezier(.18,.89,.32,1.2)}
  .pcount{font-size:13px;font-weight:800;color:#c06fa0;margin-bottom:18px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:10px}
  .tile{position:relative;aspect-ratio:1;border:0;border-radius:18px;cursor:pointer;font-family:inherit;
    background:#fff;box-shadow:0 6px 16px rgba(255,46,147,.18);overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    transition:transform .15s,box-shadow .2s}
  .tile:hover{transform:translateY(-3px) scale(1.04)}
  .tile .num{font-size:18px;font-weight:800;line-height:1}
  .tile .ic{font-size:20px;line-height:1}
  .tile.locked{background:rgba(255,255,255,.5);color:#c6a9bd;box-shadow:none}
  .tile.locked .num{font-size:13px;opacity:.7}
  .tile.peek{background:rgba(255,255,255,.78)}
  .tile.open{background:linear-gradient(135deg,#fff,#ffe9f4)}
  .tile.fresh{animation:glow 1.8s ease-in-out infinite}
  .tile.fresh:before{content:"";position:absolute;inset:0;border-radius:18px;padding:2px;
    background:linear-gradient(120deg,var(--gold),var(--hot),var(--purple),var(--gold));background-size:300% 300%;
    animation:shine 3s linear infinite;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  @keyframes glow{0%,100%{box-shadow:0 6px 16px rgba(255,46,147,.25)}50%{box-shadow:0 8px 26px rgba(255,46,147,.55)}}
  .tile.opened{opacity:.72}
  .tile .done{position:absolute;top:4px;right:6px;font-size:11px;color:var(--hot)}
  .tile.finale{background:linear-gradient(135deg,#fff3cf,#ffd56b)}

  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-80px);z-index:90;
    background:rgba(90,42,71,.92);color:#fff;padding:11px 20px;border-radius:99px;font-weight:700;font-size:14px;
    box-shadow:0 10px 24px rgba(0,0,0,.2);opacity:0;transition:transform .35s,opacity .35s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  /* modal */
  .modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:18px;
    background:rgba(120,60,95,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .modal.show{display:flex;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{position:relative;width:100%;max-width:440px;max-height:88dvh;overflow-y:auto;text-align:center;
    background:rgba(255,255,255,.94);border:2px solid #fff;border-radius:var(--radius);box-shadow:var(--shadow);
    padding:30px 22px 26px;animation:pop .5s cubic-bezier(.18,.89,.32,1.45)}
  @keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:none}}
  .close{position:absolute;top:12px;right:14px;border:0;background:#fff0f7;color:#c06fa0;width:34px;height:34px;
    border-radius:50%;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 10px rgba(255,46,147,.2)}
  .daytag{font-size:13px;font-weight:800;color:#c06fa0;letter-spacing:1px;text-transform:uppercase}
  .catlabel{display:inline-block;margin:8px 0 6px;padding:5px 14px;border-radius:99px;font-weight:800;font-size:13px;
    background:linear-gradient(135deg,#ffe9a8,#ffd56b);color:#9a5b00;box-shadow:0 6px 14px rgba(255,180,40,.4)}
  .reason{font-size:clamp(20px,5.6vw,25px);font-weight:800;line-height:1.25;margin:8px 4px 14px}
  .mbody{font-size:16px;line-height:1.6;font-weight:600;color:#5a3a4e;margin:0 2px 16px}
  .media{margin:8px 0 4px}
  .media img{width:100%;border-radius:16px;box-shadow:0 10px 24px rgba(255,46,147,.25)}
  .embed{width:100%;border:0;border-radius:14px}
  .ytwrap{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;box-shadow:0 10px 24px rgba(255,46,147,.25)}
  .ytwrap .embed{position:absolute;inset:0;width:100%;height:100%}

  .reply{margin-top:16px;text-align:left}
  .reply textarea{width:100%;min-height:80px;border:2px solid #ffd1e8;border-radius:14px;padding:12px;
    font-family:inherit;font-size:15px;resize:vertical;color:var(--ink)}
  .reply textarea:focus{outline:none;border-color:var(--hot)}

  .btn{border:0;cursor:pointer;font-weight:800;font-size:17px;font-family:inherit;padding:14px 26px;border-radius:99px;
    color:#fff;transition:transform .15s,box-shadow .2s}
  .btn:active{transform:scale(.95)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn-wide{width:100%;margin-top:10px}
  .btn-go{background:linear-gradient(135deg,var(--gold),var(--hot),var(--purple));background-size:200% auto;
    box-shadow:0 10px 24px rgba(255,46,147,.45);animation:shine 3s linear infinite}
  .tiny{font-size:12px;color:#b88ca8;margin-top:10px;font-weight:600;text-align:center}

  /* auth gate */
  #gate{position:relative;z-index:1;max-width:400px;margin:6vh auto 0}
  .gcard{background:rgba(255,255,255,.86);backdrop-filter:blur(16px);border:2px solid #fff;border-radius:var(--radius);
    box-shadow:var(--shadow);padding:30px 24px;text-align:center}
  .gcard h2{font-family:'Pacifico',cursive;font-size:30px;margin:4px 0 2px;color:var(--hot)}
  .gcard p.sub{font-size:14px;color:#9a6e88;font-weight:600;margin:2px 0 18px}
  .field{display:block;width:100%;margin:8px 0;padding:13px 15px;border:2px solid #ffd1e8;border-radius:14px;
    font-family:inherit;font-size:15px;color:var(--ink)}
  .field:focus{outline:none;border-color:var(--hot)}
  .switch{font-size:13px;font-weight:700;color:#9a6e88;margin-top:14px}
  .switch a{color:var(--hot);cursor:pointer;text-decoration:underline}
  .gnote{font-size:13px;font-weight:700;margin-top:10px;min-height:18px}
  .gnote.err{color:#e23a6e}.gnote.ok{color:#1aa06a}

  .demo-banner{position:fixed;bottom:0;left:0;right:0;z-index:70;background:rgba(90,42,71,.92);color:#fff;
    text-align:center;font-size:12px;font-weight:700;padding:7px}

  #burst{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
  .conf{position:absolute;will-change:transform,opacity;animation:fall var(--d) ease-in forwards}
  @keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),110vh) rotate(var(--r));opacity:0}}

  .hidden{display:none!important}
</style>
</head>
<body>
  <div class="deco" id="deco"></div>
  <div id="burst"></div>
  <div class="toast" id="toast"></div>

  <!-- ===== AUTH GATE ===== -->
  <div id="gate" class="hidden">
    <div class="gcard">
      <h2>88 days 💌</h2>
      <p class="sub" id="gateSub">make your account to unlock your surprise</p>
      <input class="field" id="fUser"  type="text" placeholder="pick a username 👤" autocomplete="username">
      <input class="field" id="fEmail" type="email" placeholder="your email" autocomplete="email">
      <input class="field" id="fPass"  type="password" placeholder="a password" autocomplete="current-password">
      <button class="btn btn-go btn-wide" id="gateBtn">Create my account 💕</button>
      <p class="gnote" id="gateNote"></p>
      <p class="switch" id="gateSwitch">already have an account? <a id="toLogin">log in</a></p>
    </div>
  </div>

  <!-- ===== APP ===== -->
  <div class="wrap hidden" id="app">
    <header>
      <h1>88 days</h1>
      <p class="tagline">a little something for you, every day 💌</p>
      <p class="hi" id="hi"></p>
      <div class="progress"><i id="bar"></i></div>
      <div class="pcount" id="pcount">—</div>
    </header>
    <div class="grid" id="grid"></div>
  </div>

  <!-- modal -->
  <div class="modal" id="modal">
    <div class="sheet" id="sheet">
      <button class="close" id="close">✕</button>
      <div class="daytag" id="daytag"></div>
      <div class="catlabel" id="catlabel"></div>
      <h2 class="reason" id="mReason"></h2>
      <div class="mbody" id="mBody"></div>
      <div class="media" id="mMedia"></div>
      <div class="reply" id="mReply" style="display:none">
        <textarea id="replyText" placeholder="type your answer to me…"></textarea>
        <button class="btn btn-go btn-wide" id="replySend">Send it to me 💌</button>
        <p class="tiny" id="replyNote"></p>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="calendar-data.js"></script>
<script>
/* =========================================================
   CONFIG (defaults; live values come from Supabase when set)
   ========================================================= */
const CONFIG = {
  herName: "Shiho",
  total: 88,
  startDate: "2026-06-08",   // demo fallback; the real one lives in Supabase app_config
  dailyLimit: 4              // demo fallback; the real one lives in Supabase app_config
  // (Telegram pings now go through the Supabase "notify" Edge Function — no token here)
};

const ENTRIES = window.CAL_ENTRIES || {};
const CATS = {
  music:{e:"🎵",l:"Music"}, youtube:{e:"📺",l:"Watch"}, photo:{e:"📸",l:"Postcard"},
  quote:{e:"💬",l:"Words"}, joke:{e:"😂",l:"Joke"}, inside:{e:"🤙",l:"Us"},
  question:{e:"❓",l:"For you"}, coupon:{e:"🎟️",l:"Coupon"}, note:{e:"💌",l:"Note"},
  finale:{e:"💍",l:"Day 88"}
};
const CHEATS = ["hop hop hop — arrête de tricher 😏","nice try… patience, my love 🙅‍♀️",
  "that one's not ready for you yet 👀","brooo no peeking 😤💕","slow down, greedy 😋 come back later"];

/* runtime config (demo uses these; with Supabase the server is authoritative) */
let RT = { start:null, total:CONFIG.total };
const SB_ON = !!(window.SB && window.SB.url && window.SB.anon);
let sb = SB_ON ? supabase.createClient(window.SB.url, window.SB.anon) : null;

/* ---------- dates ---------- */
function parseDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function midnight(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function unlockDate(n){const d=new Date(RT.start);d.setDate(RT.start.getDate()+(n-1));return d;}
function fmt(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function currentUnlocked(){
  const diff=Math.floor((midnight(new Date())-RT.start)/86400000)+1;
  return Math.max(0,Math.min(RT.total,diff));
}

/* ---------- background hearts ---------- */
(function(){const c=document.getElementById('deco');const e=['💖','💗','💕','✨','🎀','🦋','💝'];
  for(let i=0;i<20;i++){const s=document.createElement('span');s.textContent=e[Math.floor(Math.random()*e.length)];
    s.style.left=Math.random()*100+'vw';s.style.fontSize=(14+Math.random()*26)+'px';
    s.style.animationDuration=(8+Math.random()*10)+'s';s.style.animationDelay=(-Math.random()*14)+'s';c.appendChild(s);}})();

/* ---------- confetti / toast ---------- */
function burst(n){const layer=document.getElementById('burst');const e=['💖','💕','✨','🎀','💗','🌸','⭐'];
  for(let i=0;i<(n||40);i++){const c=document.createElement('div');c.className='conf';
    c.textContent=e[Math.floor(Math.random()*e.length)];c.style.left=(20+Math.random()*60)+'vw';
    c.style.top=(-10-Math.random()*15)+'vh';c.style.fontSize=(16+Math.random()*20)+'px';
    c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.setProperty('--r',(Math.random()*720-360)+'deg');
    c.style.setProperty('--d',(1.6+Math.random()*1.4)+'s');layer.appendChild(c);setTimeout(()=>c.remove(),3200);}}
let toastT=null;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800);}

/* =========================================================
   STORE — swappable backend (Supabase) / local demo
   ========================================================= */
// state() -> {available, opened:[{d,c}], used_today, total, daily_limit}
// openCard(day) -> {allowed, reason, card?}
const SupaStore = {
  async state(){
    const {data,error}=await sb.rpc('calendar_state');
    if(error||!data||data.error)return {available:0,opened:[],used_today:0,total:CONFIG.total,daily_limit:CONFIG.dailyLimit};
    return data;
  },
  async openCard(day){
    const {data,error}=await sb.rpc('open_day',{p_day:day});
    if(error)return {allowed:false,reason:'error'};
    return data;
  },
  async saveReply(day,text){
    const u=(await sb.auth.getUser()).data.user;
    await sb.from('replies').insert({user_id:u.id,day,body:text});
  }
};
// ----- demo (no backend): content from calendar-data.js, state in localStorage -----
function demoFilled(){let n=0;while(ENTRIES[n+1])n++;return n;}                 // contiguous from 1
function demoOpened(){try{return JSON.parse(localStorage.getItem('cal_opened')||'[]');}catch(e){return [];}}
function demoToday(){try{const t=JSON.parse(localStorage.getItem('cal_today')||'{}');return t.date===new Date().toDateString()?(t.n||0):0;}catch(e){return 0;}}
function demoBump(){localStorage.setItem('cal_today',JSON.stringify({date:new Date().toDateString(),n:demoToday()+1}));}
function demoAvail(){return Math.max(0,Math.min(RT.total,Math.min(currentUnlocked(),demoFilled())));}
const LocalStore = {
  async state(){
    return {available:demoAvail(),
      opened:demoOpened().map(d=>({d,c:(ENTRIES[d]&&ENTRIES[d].category)||'note'})),
      used_today:demoToday(), total:RT.total, daily_limit:CONFIG.dailyLimit};
  },
  async openCard(day){
    const avail=demoAvail();
    if(day<1||day>RT.total)return {allowed:false,reason:'range'};
    if(day===RT.total&&currentUnlocked()<RT.total)return {allowed:false,reason:'finale'};
    if(day>avail)return {allowed:false,reason:'locked'};
    const opened=demoOpened();
    if(!opened.includes(day)){
      if(demoToday()>=CONFIG.dailyLimit)return {allowed:false,reason:'limit'};
      opened.push(day);try{localStorage.setItem('cal_opened',JSON.stringify(opened));}catch(e){}demoBump();
    }
    return {allowed:true,reason:'ok',card:ENTRIES[day]||{category:'note',reason:`Reason #${day}`,body:'…'}};
  },
  async saveReply(){/* demo: nothing persisted */}
};
let Store = LocalStore;

/* =========================================================
   AUTH (Supabase only)
   ========================================================= */
let mode='signup';
function showGate(){document.getElementById('gate').classList.remove('hidden');document.getElementById('app').classList.add('hidden');}
function setMode(m){
  mode=m;
  document.getElementById('fUser').classList.toggle('hidden',m==='login');
  document.getElementById('gateBtn').textContent = m==='signup'?'Create my account 💕':'Log in 💕';
  document.getElementById('gateSub').textContent = m==='signup'?'make your account to unlock your surprise':'welcome back 💕';
  document.getElementById('gateSwitch').innerHTML = m==='signup'
    ? 'already have an account? <a id="toLogin">log in</a>'
    : 'new here? <a id="toLogin">create an account</a>';
  document.getElementById('toLogin').onclick=()=>setMode(m==='signup'?'login':'signup');
  document.getElementById('gateNote').textContent='';
}
async function doAuth(){
  const note=document.getElementById('gateNote');note.className='gnote';
  const email=document.getElementById('fEmail').value.trim();
  const pass=document.getElementById('fPass').value;
  const user=document.getElementById('fUser').value.trim();
  if(!email||!pass||(mode==='signup'&&!user)){note.classList.add('err');note.textContent='fill everything in 🙂';return;}
  document.getElementById('gateBtn').disabled=true;note.textContent='one sec… 💫';
  try{
    if(mode==='signup'){
      const {error}=await sb.auth.signUp({email,password:pass,options:{data:{username:user}}});
      if(error)throw error;
      note.className='gnote ok';note.textContent='account created! logging you in… 💕';
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
    }
    await afterAuth();
  }catch(e){
    note.className='gnote err';
    note.textContent=(e&&e.message)?e.message:'something went wrong 😕';
  }finally{document.getElementById('gateBtn').disabled=false;}
}
async function afterAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showGate();return;}
  const {data:prof}=await sb.from('profiles').select('username').eq('id',session.user.id).single();
  const name=(prof&&prof.username)||'you';
  document.getElementById('hi').innerHTML=`hi ${name} 💕 &nbsp;·&nbsp; <a id="logout">log out</a>`;
  document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload();};
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await build();
}

/* =========================================================
   GRID
   ========================================================= */
let STATE={available:0,opened:[],used_today:0,total:CONFIG.total,daily_limit:CONFIG.dailyLimit};
async function build(){
  STATE=await Store.state();
  const total=STATE.total||CONFIG.total;RT.total=total;
  const avail=STATE.available||0;
  const openedMap={};(STATE.opened||[]).forEach(o=>{openedMap[o.d]=o.c||'note';});
  const openedDays=Object.keys(openedMap).map(Number);
  const grid=document.getElementById('grid');grid.innerHTML='';
  for(let n=1;n<=total;n++){
    const t=document.createElement('button');t.className='tile';t.dataset.day=n;
    if(openedMap[n]!==undefined){
      const cat=openedMap[n];t.classList.add('open','opened');if(cat==='finale')t.classList.add('finale');
      t.innerHTML=`<span class="done">✓</span><span class="ic">${(CATS[cat]||{e:'🎁'}).e}</span><span class="num">${n}</span>`;
    }else if(n<=avail){
      t.classList.add('open','fresh');                       // unopened & available -> mystery box, glowing
      t.innerHTML=`<span class="ic">🎁</span><span class="num">${n}</span>`;
    }else{
      t.classList.add('locked');t.innerHTML=`<span class="ic">🔒</span><span class="num">${n}</span>`;
    }
    t.addEventListener('click',()=>openDay(n,t));
    grid.appendChild(t);
  }
  const left=Math.max(0,(STATE.daily_limit||0)-(STATE.used_today||0));
  const toOpen=Math.max(0,avail-openedDays.length);
  document.getElementById('bar').style.width=Math.round(openedDays.length/total*100)+'%';
  document.getElementById('pcount').textContent=
    `${openedDays.length} / ${total} opened` + (toOpen?` · 🎁 ${toOpen} to open`:'') + ` · ${left} left today`;
}

/* ---------- media ---------- */
function spotifyEmbed(url){
  let m=url.match(/spotify\.com\/(track|album|playlist|episode|show)\/([A-Za-z0-9]+)/)
        || url.match(/spotify:(track|album|playlist|episode|show):([A-Za-z0-9]+)/);
  if(!m)return '';
  return `<iframe class="embed" style="height:152px" src="https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator" allow="autoplay;clipboard-write;encrypted-media;fullscreen;picture-in-picture" loading="lazy"></iframe>`;
}
function youtubeEmbed(url){
  const m=String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  const id=m?m[1]:String(url).trim();
  return `<div class="ytwrap"><iframe class="embed" src="https://www.youtube.com/embed/${id}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
}

/* ---------- open a day ---------- */
const LIMIT_MSGS=["that's your "+'%n'+" for today 😏 come back tomorrow 💕","easy tiger 🐯 no more today — see you tomorrow 💕","you've had your fill for today 😋 patience, my love 💕"];
async function openDay(n,tile){
  const res=await Store.openCard(n);
  if(!res.allowed){
    if(res.reason==='limit')toast(LIMIT_MSGS[Math.floor(Math.random()*LIMIT_MSGS.length)].replace('%n',(STATE.daily_limit||4)+' cards'));
    else if(res.reason==='finale')toast('💍 the last one only opens on the final day');
    else if(res.reason==='locked')toast(CHEATS[Math.floor(Math.random()*CHEATS.length)]);
    else if(res.reason==='auth')showGate();
    else toast('hmm, try again in a sec 💕');
    return;
  }
  const c=res.card||{};const cat=c.category||'note';const meta=CATS[cat]||{e:'🎁',l:'Surprise'};
  document.getElementById('daytag').textContent=`Day ${n}`;
  document.getElementById('catlabel').textContent=`${meta.e} ${meta.l}`;
  document.getElementById('mReason').innerHTML=c.reason||'';
  document.getElementById('mBody').innerHTML=(c.body||'').replace(/\n/g,'<br>');
  let media='';
  if(c.spotify)media=spotifyEmbed(c.spotify);
  else if(c.youtube)media=youtubeEmbed(c.youtube);
  else if(c.image)media=`<img src="${c.image}" alt="day ${n}" loading="lazy">`;
  document.getElementById('mMedia').innerHTML=media;

  const reply=document.getElementById('mReply');
  if(c.ask){reply.style.display='';document.getElementById('replyText').value='';
    document.getElementById('replyNote').textContent='';
    document.getElementById('replySend').onclick=()=>sendReply(n);}
  else reply.style.display='none';

  document.getElementById('modal').classList.add('show');
  burst(cat==='finale'?90:40);
  build();   // resync tiles + counters
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('close').addEventListener('click',closeModal);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ---------- her reply ---------- */
async function sendReply(n){
  const txt=document.getElementById('replyText').value.trim();
  const note=document.getElementById('replyNote');
  if(!txt){note.textContent='write something first 🙂';return;}
  note.textContent='sending… 💌';
  try{ await Store.saveReply(n,txt); }catch(e){}
  // instant ping to your Telegram, server-side (token stays in the Edge Function)
  if(SB_ON){
    fetch(`${window.SB.url}/functions/v1/notify`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':window.SB.anon,'Authorization':`Bearer ${window.SB.anon}`},
      body:JSON.stringify({kind:'reply',name:CONFIG.herName,day:n,text:txt})
    }).catch(()=>{});
  }
  note.textContent='sent 💌';
}

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  if(SB_ON){
    Store=SupaStore;
    document.getElementById('toLogin').onclick=()=>setMode(mode==='signup'?'login':'signup');
    document.getElementById('gateBtn').onclick=doAuth;
    setMode('signup');
    const {data:{session}}=await sb.auth.getSession();
    if(session)await afterAuth(); else showGate();
  }else{
    // DEMO mode: no backend configured yet
    RT.start=parseDate(CONFIG.startDate);RT.total=CONFIG.total;
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('hi').textContent='demo mode 👀';
    await build();
    const b=document.createElement('div');b.className='demo-banner';
    b.textContent='demo mode — add your Supabase keys in supabase-config.js to enable accounts & anti-cheat';
    document.body.appendChild(b);
  }
})();
</script>
