<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · 88 days</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--hot:#ff2e93;--purple:#b388ff;--gold:#ffd56b;--ink:#3a2233}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Quicksand',-apple-system,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,#f6f0ff,#ffeef6);min-height:100vh;padding:24px 16px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:26px;margin:0 0 4px}
  .muted{color:#8a6e80;font-size:14px;margin:0 0 20px;font-weight:600}
  .card{background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(179,136,255,.18);padding:20px;margin-bottom:16px}
  input{width:100%;padding:12px 14px;border:2px solid #e8def5;border-radius:12px;font-family:inherit;font-size:15px;margin:6px 0}
  input:focus{outline:none;border-color:var(--hot)}
  .btn{border:0;cursor:pointer;font-weight:800;font-size:15px;font-family:inherit;padding:12px 22px;border-radius:99px;color:#fff;
    background:linear-gradient(135deg,var(--hot),var(--purple))}
  .btn.sm{padding:8px 16px;font-size:13px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .u{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #f0e8f7;padding:12px 0}
  .u:last-child{border:0}
  .uname{font-weight:800;font-size:17px}
  .usub{font-size:12px;color:#9a8aa6}
  .bar{height:10px;border-radius:99px;background:#f0e8f7;overflow:hidden;flex:1;min-width:140px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--hot),var(--purple))}
  .pct{font-weight:800;font-size:13px;color:var(--hot);min-width:64px;text-align:right}
  .replies{margin-top:6px}
  .reply{background:#fbf5ff;border-radius:12px;padding:8px 12px;margin:6px 0;font-size:14px}
  .reply b{color:var(--hot)}
  .note{font-size:13px;font-weight:700;margin-top:8px}
  .note.err{color:#e23a6e}
  .cfg input{display:inline-block;width:auto;margin-right:8px}
  .hidden{display:none}
  details{margin-top:8px}
  summary{cursor:pointer;font-weight:700;font-size:13px;color:#9a6e88}
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 88 days · admin</h1>
  <p class="muted">your private dashboard — see where she's at</p>

  <!-- login -->
  <div class="card" id="login">
    <div id="cfgMissing" class="hidden note err">⚠️ Add your Supabase keys in supabase-config.js first.</div>
    <input id="email" type="email" placeholder="your email">
    <input id="pass" type="password" placeholder="your password">
    <button class="btn" id="loginBtn">Log in</button>
    <p class="note err" id="loginNote"></p>
  </div>

  <!-- dashboard -->
  <div id="dash" class="hidden">
    <div class="card cfg">
      <div class="row" style="justify-content:space-between">
        <strong>⚙️ Settings</strong>
        <button class="btn sm" id="logout">log out</button>
      </div>
      <p class="usub" style="margin:10px 0 4px">Day 1 unlocks on — and how many cards she can open ahead:</p>
      <div class="row">
        <input id="cStart" type="date">
        <input id="cPeek" type="number" min="0" max="20" style="width:80px" title="peek ahead">
        <button class="btn sm" id="saveCfg">Save</button>
        <span class="note" id="cfgNote"></span>
      </div>
    </div>

    <div class="card">
      <strong id="usersTitle">People</strong>
      <div id="users"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const SB_ON=!!(window.SB&&window.SB.url&&window.SB.anon);
let sb=SB_ON?supabase.createClient(window.SB.url,window.SB.anon):null;
let TOTAL=88;

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDT(s){if(!s)return '—';const d=new Date(s);return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}

async function login(){
  const note=document.getElementById('loginNote');note.textContent='';
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){note.textContent=error.message;return;}
  await load();
}
async function load(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const {data:isAdmin}=await sb.rpc('is_admin');
  if(!isAdmin){document.getElementById('loginNote').textContent='this account is not an admin. (run the admin SQL line for your email)';return;}
  document.getElementById('login').classList.add('hidden');
  document.getElementById('dash').classList.remove('hidden');

  const {data:cfg}=await sb.from('app_config').select('*').eq('id',1).single();
  if(cfg){TOTAL=cfg.total;document.getElementById('cStart').value=cfg.start_date;document.getElementById('cPeek').value=cfg.peek_ahead;}

  const [{data:profiles},{data:opens},{data:replies}]=await Promise.all([
    sb.from('profiles').select('id,username,created_at,last_seen,is_admin').order('created_at'),
    sb.from('opens').select('user_id,day,opened_at'),
    sb.from('replies').select('user_id,day,body,created_at').order('created_at')
  ]);

  const byUser={};
  (opens||[]).forEach(o=>{(byUser[o.user_id]=byUser[o.user_id]||{opens:[],replies:[]}).opens.push(o);});
  (replies||[]).forEach(r=>{(byUser[r.user_id]=byUser[r.user_id]||{opens:[],replies:[]}).replies.push(r);});

  const list=document.getElementById('users');list.innerHTML='';
  const people=(profiles||[]).filter(p=>!p.is_admin);
  document.getElementById('usersTitle').textContent=`People (${people.length})`;
  if(!people.length)list.innerHTML='<p class="usub">no one has signed up yet 💤</p>';
  people.forEach(p=>{
    const u=byUser[p.id]||{opens:[],replies:[]};
    const count=u.opens.length;const pct=Math.round(count/TOTAL*100);
    const maxDay=u.opens.reduce((m,o)=>Math.max(m,o.day),0);
    const rep=u.replies.sort((a,b)=>a.day-b.day).map(r=>`<div class="reply"><b>Day ${r.day}</b> · ${fmtDT(r.created_at)}<br>${esc(r.body)}</div>`).join('');
    const div=document.createElement('div');div.className='u';
    div.innerHTML=`
      <div style="min-width:150px">
        <div class="uname">${esc(p.username)||'(no name)'}</div>
        <div class="usub">last seen ${fmtDT(p.last_seen)} · max day ${maxDay}</div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="pct">${count}/${TOTAL}</div>
      <div style="flex-basis:100%">
        ${rep?`<details><summary>${u.replies.length} repl${u.replies.length>1?'ies':'y'} 💌</summary><div class="replies">${rep}</div></details>`:''}
      </div>`;
    list.appendChild(div);
  });
}
async function saveCfg(){
  const note=document.getElementById('cfgNote');note.className='note';
  const start=document.getElementById('cStart').value;
  const peek=parseInt(document.getElementById('cPeek').value,10);
  const {error}=await sb.from('app_config').update({start_date:start,peek_ahead:peek}).eq('id',1);
  note.textContent=error?('⚠️ '+error.message):'saved ✓';
  if(error)note.classList.add('err');
}

if(!SB_ON){document.getElementById('cfgMissing').classList.remove('hidden');}
else{
  document.getElementById('loginBtn').onclick=login;
  document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload();};
  document.getElementById('saveCfg').onclick=saveCfg;
  sb.auth.getSession().then(({data:{session}})=>{if(session)load();});
}
</script>
</body>
</html>
